apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gobg-test

commonAnnotations:
  kustomize.toolkit.fluxcd.io/ssa: "Merge"
  kustomize.toolkit.fluxcd.io/force: "enabled"

resources:
  - ns.yaml
  - ../../base
  - gateway.yaml
  - canary.yaml

patchesJson6902:
  - target:
      version: v1
      kind: Service
      name: gobg
    path: patch-service.yaml

  - target:
      group: flagger.app
      version: v1beta1
      kind: Canary
      name: gobg
    path: patch-canary.yaml
