apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gobg-test

resources:
  - ns.yaml
  - ../../base
  - gateway.yaml

patches:
  
  - target:
      kind: Service
      name: gobg
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: gobg
      spec:
        type: NodePort
        ports:
          - name: http       
            port: 8080
            targetPort: 8080
            nodePort: 30081 

 
  - target:
      kind: Canary
      name: gobg
    patch: |-
      - op: replace
        path: /spec/service/gateways
        value:
          - gobg-gateway
          - mesh
      - op: replace
        path: /spec/service/hosts
        value:
          - "*"
