- op: replace
  path: /spec/service/gateways
  value:
    - gobg-gateway
    - mesh

- op: replace
  path: /spec/service/hosts
  value:
    - gobg
    - gobg.gobg-test
    - gobg.gobg-test.svc.cluster.local

- op: add
  path: /spec/analysis/webhooks
  value:
    - name: load-test
      type: rollout
      url: http://flagger-loadtester.gobg-test.svc.cluster.local/
      timeout: 5s
      metadata:
        type: cmd
        cmd: "hey -z 1m -q 10 -c 2 http://gobg-canary.gobg-test.svc.cluster.local/"