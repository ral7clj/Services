apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-loadtester
  namespace: gobg-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: flagger-loadtester}
  template:
    metadata:
      labels: {app: flagger-loadtester}
    spec:
      containers:
        - name: loadtester
          image: ghcr.io/fluxcd/flagger-loadtester:0.36.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 9090}]
---
apiVersion: v1
kind: Service
metadata:
  name: flagger-loadtester
  namespace: gobg-test
spec:
  selector: {app: flagger-loadtester}
  ports: [{port: 80, targetPort: 9090}]