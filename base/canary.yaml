apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: gobg
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gobg
  service:
    port: 80
    targetPort: 8080
    gateways:
      - mesh 
    hosts:
      - gobg 
  analysis:
    interval: 15s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m